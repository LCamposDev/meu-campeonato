services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meu-campeonato-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - campeonato-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: meu-campeonato-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - campeonato-network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: meu-campeonato-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: meu-campeonato
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - campeonato-network

networks:
  campeonato-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
